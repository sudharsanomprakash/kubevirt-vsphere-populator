name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the kind end-to-end test (fake vSphere, not a real vSphere)
        type: boolean
        default: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.27.1

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          "$(go env GOPATH)/bin/golangci-lint" run ./...
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: go vet
        run: go vet ./...
      - name: generated code and CRD are up to date
        run: make verify-generate

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: install qemu-img
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils
      - name: unit, integration and envtest suites (race detector)
        # sudo -E keeps GOTOOLCHAIN/PATH so that loop-device tests run as root.
        run: sudo -E env "PATH=$PATH" make test-race

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: build controller and worker images
        run: make images VERSION=ci-${{ github.sha }}
      - name: smoke-test images
        run: |
          docker run --rm ghcr.io/sudharsanomprakash/kubevirt-vsphere-populator-controller:ci-${{ github.sha }} --version
          docker run --rm ghcr.io/sudharsanomprakash/kubevirt-vsphere-populator-worker:ci-${{ github.sha }} version
          docker run --rm --entrypoint qemu-img ghcr.io/sudharsanomprakash/kubevirt-vsphere-populator-worker:ci-${{ github.sha }} --version

  e2e-kind:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: install qemu
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils qemu-system-x86 cloud-image-utils
      - name: kind end-to-end
        run: make e2e-kind
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: hack/e2e/work/logs
